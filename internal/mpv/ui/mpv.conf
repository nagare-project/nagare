# nagare 自己的 mpv 配置（随 nagare 分发，每次起播都会覆盖回这一份；改了也会被改回去）。
# nagare 用 --config-dir 指到这里启动 mpv，不读用户自己的 mpv 配置。

# 界面由 scripts/nagare 画。mpv 自带的控制条（osc）不在这里关，由界面脚本加载好之后自己关：
# 万一脚本没加载起来，用户手上至少还有自带的控制条。
osd-bar=no
osd-on-seek=no
# mpv 自己的屏幕文字（「Speed: 1.25」「Volume: 50%」之类）一律不显示：界面会用自己的提示说，
# 两套同时出来只会重复
osd-level=0

# 鼠标停 1 秒就藏光标；界面自己 2 秒后淡出
cursor-autohide=1000

# 硬件解码（mpv 默认是软解）：HEVC 10bit 的 BDRip、再开画质增强时，软解在弱机器上会掉帧。
# auto-safe 只用 mpv 认为稳定的解码器，出问题自动退回软解。
hwdec=auto-safe

# 进度由 nagare 记、续播由 nagare 传 --start：mpv 自己的续播关掉。
# 「同目录自动成列表」（autocreate-playlist）mpv 默认就是关的，这里不写：0.39 之前的 mpv
# 不认这个选项，写了会报错。
save-position-on-quit=no
resume-playback=no

# 窗口
keep-open=no
window-dragging=yes
