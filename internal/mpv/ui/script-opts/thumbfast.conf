# thumbfast（进度条缩略图，po5/thumbfast，MPL-2.0）的设置。显示由 scripts/nagare 负责。

# 缩略图最大尺寸（像素，HiDPI 下按缩放放大）：16:9 的片子出来是 192×108，与界面设计稿一致
max_width=192
max_height=192
# 网络流（磁力边下边播、在线播放）不生成缩略图：生成缩略图的那个 mpv 要去读流里别的位置，
# 磁力下等于凭空多一个读位置，和播放抢带宽
network=no
audio=no
# 第一次悬停进度条时才起缩略图进程；闲置 10 分钟收掉
spawn_first=no
quit_after_inactivity=600
# mpv_path 由 nagare 起播时用 --script-opts-append 传进来（Windows 的内置 mpv 不在 PATH 里）
