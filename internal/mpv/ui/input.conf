# nagare 播放器快捷键（没列出的键保留 mpv 默认）。

SPACE        cycle pause
MBTN_LEFT_DBL cycle fullscreen
ENTER        cycle fullscreen
KP_ENTER     cycle fullscreen
ESC          set fullscreen no

LEFT         seek -5
RIGHT        seek 5
UP           add volume 5
DOWN         add volume -5
WHEEL_UP     add volume 5
WHEEL_DOWN   add volume -5
m            cycle mute

[            add speed -0.25
]            add speed 0.25
BS           set speed 1.0

# 上一集 / 下一集（同一个窗口里切；没有的时候界面提示「没有下一集了」）。
# mpv 默认的 p 是暂停、P 是显示进度、媒体键是播放列表上一个 / 下一个，这里都换掉
n            script-binding nagare/next
N            script-binding nagare/next
p            script-binding nagare/prev
P            script-binding nagare/prev
NEXT         script-binding nagare/next
PREV         script-binding nagare/prev

d            script-binding nagare/toggle-danmaku
D            script-binding nagare/toggle-danmaku
s            script-binding nagare/screenshot
S            script-binding nagare/screenshot
t            cycle ontop
T            cycle ontop

MBTN_RIGHT   script-binding nagare/menu
TAB          script-binding nagare/menu

q            quit
Q            quit
