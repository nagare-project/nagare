# nagare 发布流水线（GoReleaser v2 OSS）。零证书方案：
#   macOS    universal 二进制 → ad-hoc 签名的 Nagare.app → dmg（scripts/macos/build-app.sh）
#   Windows  无签名 NSIS 按用户安装包 + 便携 zip，两者都内置 mpv（scripts/windows/*）
#   Linux    tar.gz + deb/rpm，依赖系统 mpv
# 前端构建不在这里做：release workflow 先 bun run build，before hook 只检查 web/ 就位。
# 本机验证：goreleaser check && goreleaser release --snapshot --clean --skip=publish
#
# 可选分发渠道：scoops（Windows，见文件末尾）已接。其余（winget / aurs）各自需要独立的
# 清单仓库与推送 token，等 Release 形态稳定后再接。
#
# ⚠️ Homebrew cask（macOS）**已接，但刻意不在这个文件里**：
# goreleaser v2.18.0 的 homebrew_casks 只能从 `archives:` 产出的归档里挑源，而
# Nagare.app 所在的 dmg / .app.zip 是 macOS post hook 生成、经 release.extra_files 挂上去的，
# 它根本看不见；url.template 能改地址但 sha256 仍取自它挑中的那个归档（指向 dmg 会配上
# tar.gz 的哈希，brew 每次校验都失败），而且它的 cask 模板里没有 app 这一段，
# 只生成得出 `binary "nagare"`（裸二进制，没有 .app、没有菜单栏）。
# 三条实测记录与替代实现见 scripts/release/publish-homebrew-cask.sh 的文件头，
# cask 本身在 packaging/homebrew/Casks/nagare.rb。
version: 2

project_name: nagare

report_sizes: true

# 注意：goreleaser 在 before hooks 之后才检查 dist/ 为空，所以往 dist/ 写东西的步骤
# （拉取 mpv）不能放这里，放在 windows build 的 pre hook 里。
before:
  hooks:
    - scripts/release/check-web.sh

builds:
  # macOS：托盘用 fyne.io/systray，需要 cgo，所以只能在 macOS runner 上原生编；
  # 两个 arch 再由 universal_binaries 合成一个。
  # CGO_ENABLED 默认 1（CI 必须是 1，否则 .app 没有托盘）；本机 SDK 过旧链接不过时可用
  # `CGO_ENABLED=0 goreleaser release --snapshot ...` 临时覆盖，只验证流水线其余部分。
  - id: darwin
    binary: nagare
    goos: [darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED={{ if index .Env "CGO_ENABLED" }}{{ .Env.CGO_ENABLED }}{{ else }}1{{ end }}
      # 必须钉死部署目标：cgo 走外部链接，clang 默认把 runner 的 SDK 版本写进
      # LC_BUILD_VERSION 的 minos。CI 的 macos-latest 是 SDK 26.x，不钉的话产物
      # 只能在 macOS 26+ 启动，更老的系统直接报 kLSIncompatibleSystemVersionErr
      # （实测过一次）。数值要与 Info.plist 的 LSMinimumSystemVersion 一致。
      - MACOSX_DEPLOYMENT_TARGET=13.0
      - CGO_CFLAGS=-mmacosx-version-min=13.0
      - CGO_LDFLAGS=-mmacosx-version-min=13.0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      # pre：按 scripts/release/source-plugin.lock 拉取并校验捆绑的 Nagare Source 插件
      # （引擎 + 只含 BT 规则的 repo）→ dist/source-plugin/MacOS_{arm64,x86_64}
      pre:
        - cmd: scripts/release/fetch-source-plugin.sh darwin {{ .Arch }}
          output: true

  # Windows：纯 Go 交叉编译；-H=windowsgui 去掉控制台窗口（界面在浏览器 + 托盘）。
  - id: windows
    binary: nagare
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -H=windowsgui -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      # pre：按 scripts/windows/mpv.lock 拉取并校验内置 mpv → dist/mpv-win、dist/mpv-sources
      pre:
        - cmd: scripts/windows/fetch-mpv.sh
          output: true
        - cmd: scripts/release/fetch-source-plugin.sh windows {{ .Arch }}
          output: true
      post:
        - cmd: scripts/windows/build-installer.sh "{{ .Path }}" "{{ .Version }}" dist
          output: true

  - id: linux
    binary: nagare
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    hooks:
      pre:
        - cmd: scripts/release/fetch-source-plugin.sh linux {{ .Arch }}
          output: true

universal_binaries:
  - id: darwin-universal # 合成后的产物挂这个 id（不是 darwin），archives 里要按它引用
    ids: [darwin]
    name_template: nagare
    replace: true # 只发 universal，不单发 amd64 / arm64
    hooks:
      post:
        - cmd: scripts/macos/build-app.sh "{{ .Path }}" "{{ .Version }}" dist
          output: true

# 归档命名：nagare-<版本>_<MacOS|Linux|Windows>_<universal|x86_64|arm64>
# 每个归档都带 nagare-source/（Nagare Source 引擎 + 只含 BT 规则的 repo/），Go 侧按
# 「可执行文件旁边的 nagare-source/」这个相对位置探测（见 internal/sourceplugin/bundled.go）。
# lock 未钉版本时该目录里只有一个 README.txt，探测不到就当没捆。
archives:
  - id: darwin
    ids: [darwin-universal]
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}-{{ .Version }}_MacOS_universal'
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      # universal 二进制两种 arch 都可能跑：目录里是 nagare-source-arm64 / -amd64 两个引擎
      # 加一份 repo，运行时按 GOARCH 挑（fetch 脚本合成 MacOS_universal）
      - src: dist/source-plugin/MacOS_universal/**
        dst: nagare-source

  - id: linux
    ids: [linux]
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}-{{ .Version }}_Linux_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      - src: 'dist/source-plugin/Linux_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}/**'
        dst: nagare-source

  # 便携版：解压后 nagare.exe 旁边就是 mpv\mpv.exe，Go 侧按这个相对位置找内置 mpv。
  - id: windows
    ids: [windows]
    formats: [zip]
    name_template: '{{ .ProjectName }}-{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      - src: dist/mpv-win/**
        dst: mpv
      - src: dist/source-plugin/Windows_x86_64/**
        dst: nagare-source

nfpms:
  - id: linux-packages
    ids: [linux]
    package_name: nagare
    vendor: nagare project
    maintainer: nagare project <noreply@github.com>
    homepage: https://github.com/nagare-project/nagare
    license: AGPL-3.0
    description: |-
      本地动漫播放 agent
      本地文件与磁力边下边播共用同一个 mpv 播放引擎，浏览器就是遥控器。
      只监听 127.0.0.1，本体不内置任何内容源。
    formats: [deb, rpm]
    # 各发行版惯用名：nagare_<版本>_amd64.deb / nagare-<版本>.x86_64.rpm
    file_name_template: "{{ .ConventionalFileName }}"
    section: video
    priority: optional
    bindir: /usr/bin
    dependencies:
      - mpv
    contents:
      - src: packaging/linux/nagare.desktop
        dst: /usr/share/applications/nagare.desktop
      - src: packaging/icon/nagare-256.png
        dst: /usr/share/icons/hicolor/256x256/apps/nagare.png
      - src: THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/nagare/THIRD_PARTY_NOTICES.md
      # 捆绑的插件放 /usr/lib/nagare/nagare-source/；Go 侧从 /usr/bin 向 ../lib/nagare 找
      - src: 'dist/source-plugin/Linux_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}/'
        dst: /usr/lib/nagare/nagare-source

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # dmg / setup.exe / .app.zip / mpv 构建脚本快照不是 goreleaser 自己的归档，显式纳入校验。
  # 自更新的信任链就架在这份清单上，漏掉哪个产物，哪个产物就没法被校验。
  extra_files:
    - glob: dist/*.dmg
    - glob: dist/*.app.zip
    - glob: dist/*-setup.exe
    - glob: dist/mpv-sources/*

# 自更新的信任根：用 minisign 签 checksums.txt。
#
# 只签这一份而不是逐个产物签：清单里已经有每个产物的 sha256，客户端先验清单签名、
# 再按清单校验下载的归档，一份签名就覆盖了全部产物（dmg / setup.exe / tar.gz / zip
# / .app.zip 都在里面）。这也是 CI 侧最简单的形态 —— 只有一次签名操作。
#
# 密钥没配置时发布流水线会加 --skip=sign。那样发出去的版本仍然可用，只是客户端
# 校验不了更新包，会拒绝自更新并提示去下载页（内嵌公钥为空 = 失败关闭）。
signs:
  - id: minisign-checksums
    artifacts: checksum
    cmd: minisign
    args:
      - -S
      - -s
      - "{{ .Env.MINISIGN_KEY_FILE }}"
      - -x
      - "${signature}"
      - -c
      - "nagare {{ .Version }}"
      - -t
      - "nagare {{ .Version }} checksums"
      - -m
      - "${artifact}"
    signature: "${artifact}.minisig"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^Merge "
  groups:
    - title: 新功能
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 修复
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 其他
      order: 999

release:
  github:
    owner: nagare-project
    name: nagare
  draft: true # 先出草稿，人工检查产物后再点发布
  prerelease: auto # 带 -rc / -beta 之类后缀的 tag 自动标 pre-release
  extra_files:
    - glob: dist/*.dmg
    - glob: dist/*.app.zip # 自更新用：ad-hoc 签名的 Nagare.app 整包
    - glob: dist/*-setup.exe
    - glob: dist/mpv-sources/* # GPL 合规：Windows 包内 mpv 的构建脚本源码快照
  footer: |
    ---
    安装步骤（macOS「仍要打开」/ Windows「仍要运行」、mpv 依赖、校验方法）见
    [README「安装」](https://github.com/nagare-project/nagare#安装)。
    Windows 包内置的 mpv 及其许可证信息见 `THIRD_PARTY_NOTICES.md`。

# Scoop（Windows 可选渠道）：发版时把 manifest 推到 nagare-project/scoop-nagare。
#
# 用便携版 zip 而不是 NSIS 安装包：Scoop 的模型就是「解压到自己的目录」，不跑安装程序。
# 这也正好对上 Go 侧的内置 mpv 探测 —— zip 里 mpv\ 与 nagare.exe 的相对位置解压后不变
# （见 internal/mpv/detect.go 的 executableDir 候选）。
#
# ⚠️ 推送的是【另一个仓库】，Actions 默认的 GITHUB_TOKEN 只能写当前仓库，所以要 PAT。
# 没配 TAP_GITHUB_TOKEN 时由 release.yml 加 --skip=scoop 整条跳过，理由与 minisign 那块
# 一样：一个可选分发渠道缺 token，不该让整次发布失败。这里不用 skip_upload 表达
# 「没 token 就不推」是因为 skip_upload 只控制推送这一步，token 模板仍会被求值。
#
# ⚠️ GoReleaser v2.18.0 的 scoop 字段集里没有 checkver / autoupdate（实测确认），
# 它生成的是一份完整 manifest 并整份覆盖 bucket/nagare.json —— packaging/scoop/ 下那份
# bootstrap manifest 里的这两段会在第一次成功推送后消失。取舍见 docs/releasing.md。
scoops:
  - name: nagare
    ids: [windows] # 只取 windows 归档（便携版 zip），不碰 setup.exe
    repository:
      owner: nagare-project
      name: scoop-nagare
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/nagare-project/nagare
    description: 本地动漫播放 agent：本地文件与磁力边下边播共用一个 mpv 播放引擎，浏览器就是遥控器
    license: AGPL-3.0
    commit_msg_template: "chore: nagare {{ .Tag }}"
    # 开始菜单快捷方式：nagare 是 GUI 程序（-H=windowsgui），双击后只出托盘图标，
    # 没有快捷方式的话用户只剩 shim 一条路径，找不到「怎么启动」。
    shortcuts:
      - ["nagare.exe", "nagare"]
    # 不配 persist：配置、state.json、日志、磁力缓存全在 %AppData%\nagare，
    # 不在 Scoop 的应用目录里 —— 升级与卸载本来就碰不到（persist 是给把数据
    # 写在安装目录里的程序用的）。也不配 depends：mpv 已经在 zip 里。
    #
    # post_install 是唯一能在 scoop install 之后说话的地方（scoop 的 notes 字段
    # goreleaser 不支持），零证书的代价必须在这里讲清楚。用单引号包 PowerShell 字符串，
    # 避免 $ 展开；这几行与 packaging/scoop/bucket/nagare.json 里的必须逐字一致。
    post_install:
      - "Write-Host 'nagare 没有代码签名：首次运行时 SmartScreen 可能拦一次，点「更多信息」→「仍要运行」。' -ForegroundColor Yellow"
      - "Write-Host 'mpv 已内置（安装目录下的 mpv\\），不用另装。'"
      - "Write-Host '配置、日志、观看进度与磁力缓存在 %AppData%\\nagare，升级与卸载都不会动它。'"
      - "Write-Host '启动后只出托盘图标，界面在浏览器里自动打开。'"
    # auto：版本号带 -rc / -beta 之类后缀（即 release.prerelease 判定的预发布）时不推 bucket。
    # 预发布推上去等于把 scoop install nagare 的所有人一起带上 rc。
    skip_upload: "auto"
