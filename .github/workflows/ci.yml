# CI：前端先构建（产物是 go:embed 的输入），再跑 Go 测试与五目标交叉编译。
# 发布产物（dmg / NSIS / deb / rpm）走 release.yml；零证书方案不签名（见 README「为什么会有系统警告」）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：CI 只读代码，不发布任何东西。显式声明而非依赖仓库默认设置
# —— 以后有人往这里加写操作时，会先撞到这一行而不是悄悄拿到写权限。
permissions:
  contents: read

jobs:
  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: 安装依赖
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: 依赖漏洞扫描
        run: bun audit
        working-directory: frontend
        continue-on-error: true # 上游告警不阻断构建，但要在日志里可见
      - name: 类型检查
        run: bun run typecheck
        working-directory: frontend
      - name: 单元测试（vitest）
        run: bun run test
        working-directory: frontend
      - name: 构建产物到 web/
        run: bun run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/
          include-hidden-files: true # .gitkeep 也要带上
          if-no-files-found: error

  go-test:
    name: Go 测试
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未经 gofmt：" && echo "$unformatted" && exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: 播放器界面 Lua 语法检查
        # 真 mpv 的界面集成测试在 CI 上跑不起来（没有 mpv、没有显示器），至少先挡住语法错误。
        # 用 LuaJIT：macOS 上的 mpv 多半配它（Lua 5.1 语法），比 5.3/5.4 的 luac 更严。
        run: |
          sudo apt-get install -y --no-install-recommends luajit
          for f in internal/mpv/ui/scripts/*.lua internal/mpv/ui/scripts/nagare/*.lua; do luajit -bl "$f" > /dev/null; done
      - name: go test
        run: go test ./...
      - name: govulncheck 漏洞扫描
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: goreleaser 配置检查
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  go-test-windows:
    # 平台专属代码里只有 Windows 这一块在 ubuntu 上完全跑不到（命名管道 IPC、托盘气泡、
    # 剪贴板、自更新替换），而维护者手边没有 Windows 机器。这个 job 在真 Windows 上
    # 跑那几个包的测试 —— 至少管道拨号是真实往返过的，不是只交叉编译过。
    name: Go 测试（Windows 平台专属包）
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      # torrentstream 不在列：它的同进程 seeder 集成测试在这个 runner 上退出时清不掉
      # 刚写入的媒体文件（「being used by another process」，等 3 秒也不放，连做种方
      # 那份都被占），像是 runner 的杀软 / 索引器在扫新文件，没有 Windows 机器无法定论。
      # 那个包的 Windows 专属代码只有 EADDRINUSE 判定一处，交叉编译已经覆盖。
      - name: go test（mpv / tray / selfupdate）
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/mpv/... ./internal/tray/... ./internal/selfupdate/...

  desktop-mac:
    # macOS 桌面窗口（internal/desktop，构建标签 libmpv）的 Objective-C 只有带这个标签的 cgo 构建才编得到，
    # 其余 job 都不带它 —— 这个 job 让它在每个 PR 上至少能编、能过 vet、测试能跑，不会悄悄烂掉。
    # （发布流水线也带它，链接的是同一次运行里现编的自建 libmpv，见 release.yml；这里为了快，用开发期那份。）
    # libmpv 用的是开发期的那份（IINA 的预编译 dylib，脚本里钉了 sha256）：只下载、只拿来链接，
    # 不打包、不上传任何东西（这份 dylib 不能随发布出去，见 scripts/macos/libmpv-dev.md）。
    name: macOS 桌面窗口（-tags libmpv）
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: 缓存开发期 libmpv 的下载
        uses: actions/cache@v4
        with:
          path: .libmpv-dev/download
          key: libmpv-dev-${{ hashFiles('scripts/macos/fetch-libmpv-dev.sh') }}
      - name: 下载开发期 libmpv（只用来编译检查，绝不发布）
        run: scripts/macos/fetch-libmpv-dev.sh
      - name: go vet / 测试 / 编译
        run: |
          eval "$(scripts/macos/fetch-libmpv-dev.sh --print-env)"
          export CGO_ENABLED=1 CGO_CFLAGS CGO_LDFLAGS MACOSX_DEPLOYMENT_TARGET=13.0
          go vet -tags libmpv ./internal/desktop/...
          go vet -tags "libmpv desktoptest" ./internal/desktop/...
          go test -tags libmpv ./internal/desktop/...
          go build -tags libmpv -o /dev/null .

  build:
    name: 交叉编译 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [frontend, go-test, go-test-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe 需要完整历史
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: 编译（未签名）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          version=$(git describe --tags --always --dirty)
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "dist/nagare-${GOOS}-${GOARCH}${ext}" .
      - uses: actions/upload-artifact@v4
        with:
          name: nagare-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
