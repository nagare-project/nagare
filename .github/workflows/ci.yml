# CI：前端先构建（产物是 go:embed 的输入），再跑 Go 测试与五目标交叉编译。
# 发布产物（dmg / NSIS / deb / rpm）走 release.yml；零证书方案不签名（见 README「为什么会有系统警告」）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：CI 只读代码，不发布任何东西。显式声明而非依赖仓库默认设置
# —— 以后有人往这里加写操作时，会先撞到这一行而不是悄悄拿到写权限。
permissions:
  contents: read

jobs:
  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: 安装依赖
        run: bun install --frozen-lockfile
        working-directory: frontend
      - name: 依赖漏洞扫描
        run: bun audit
        working-directory: frontend
        continue-on-error: true # 上游告警不阻断构建，但要在日志里可见
      - name: 类型检查
        run: bun run typecheck
        working-directory: frontend
      - name: 单元测试（vitest）
        run: bun run test
        working-directory: frontend
      - name: 构建产物到 web/
        run: bun run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/
          include-hidden-files: true # .gitkeep 也要带上
          if-no-files-found: error

  go-test:
    name: Go 测试
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未经 gofmt：" && echo "$unformatted" && exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: govulncheck 漏洞扫描
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: goreleaser 配置检查
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  go-test-windows:
    # 平台专属代码里只有 Windows 这一块在 ubuntu 上完全跑不到（命名管道 IPC、托盘气泡、
    # 剪贴板、自更新替换），而维护者手边没有 Windows 机器。这个 job 在真 Windows 上
    # 跑那几个包的测试 —— 至少管道拨号是真实往返过的，不是只交叉编译过。
    name: Go 测试（Windows 平台专属包）
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      # torrentstream 不在列：它的同进程 seeder 集成测试在这个 runner 上退出时清不掉
      # 刚写入的媒体文件（「being used by another process」，等 3 秒也不放，连做种方
      # 那份都被占），像是 runner 的杀软 / 索引器在扫新文件，没有 Windows 机器无法定论。
      # 那个包的 Windows 专属代码只有 EADDRINUSE 判定一处，交叉编译已经覆盖。
      - name: go test（mpv / tray / selfupdate）
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/mpv/... ./internal/tray/... ./internal/selfupdate/...

  build:
    name: 交叉编译 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [frontend, go-test, go-test-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe 需要完整历史
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: 编译（未签名）
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          version=$(git describe --tags --always --dirty)
          go build -trimpath -ldflags "-s -w -X main.version=${version}" \
            -o "dist/nagare-${GOOS}-${GOARCH}${ext}" .
      - uses: actions/upload-artifact@v4
        with:
          name: nagare-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
