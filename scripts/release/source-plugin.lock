# 随安装包捆绑的 Nagare Source 插件（引擎 + 只含 BT 规则的运行时根目录）。
# 来源：https://github.com/nagare-project/Nagare_Source/releases/tag/v<version>
#
# 钉死步骤（Nagare_Source 发新版后）：
#   1. version=<tag 去掉 v>
#   2. 从该 release 的 SHA256SUMS 里逐条抄五个归档的 sha256 到下面
#   3. 本机跑 scripts/release/fetch-source-plugin.sh darwin arm64 验证一次
#
# version 为空 = 本次构建不捆插件：fetch 脚本只放一个说明文件，安装后用户仍可自行安装插件。
# sha256 缺失或不符一律构建失败，不会降级成「跳过校验」。
version=
sha256_MacOS_arm64=
sha256_MacOS_x86_64=
sha256_Linux_x86_64=
sha256_Linux_arm64=
sha256_Windows_x86_64=
