# Windows 包内置 mpv 的钉死记录（shinchiro/mpv-winbuild-cmake 的 x86_64 构建）。
# fetch-mpv.sh 读取本文件；sha256 不符即失败。
#
# 更新步骤：
#   1. gh release view -R shinchiro/mpv-winbuild-cmake --json tagName,assets
#      选最新 release 里 mpv-x86_64-<日期>-git-<hash>.7z（不是 v3 / aarch64 变体）
#   2. gh api repos/shinchiro/mpv-winbuild-cmake/git/ref/tags/<tag> --jq .object.sha 取 commit
#   3. 下载两个文件，shasum -a 256 算哈希填进来
#   4. 对照 THIRD_PARTY_NOTICES.md 里的组件表，与该 commit 的 packages/*.cmake 核一遍
#
# ⚠️ 上游只保留最近 30 个 release（每天一版，约一个月）：钉的这一版过期后 CI 缓存一失效，
#    下载就是 404（2026-10-21 发 v0.6.1 时 20260902 那版就这样没了）。发版前先跑 snapshot。
